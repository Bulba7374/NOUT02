<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Защита деревни: Мобильная</title>
    <style>
        :root { --pixel-size: 3px; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#0d0d1a; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Courier New',monospace; overflow:hidden; user-select:none; touch-action:pan-x pan-y; }
        #game-container {
            position:relative; width:100vw; height:100vh; max-width:900px; max-height:600px;
            border:6px solid #4a4a4a; box-shadow:0 0 0 4px #1a1a1a, 0 0 0 10px #5a5a5a, 0 0 40px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a2a;
            background:#000; overflow:hidden; touch-action:none;
        }
        canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
        #vignette { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:11; box-shadow:inset 0 0 60px 30px rgba(0,0,0,0.5); }
        #mobile-controls {
            position:absolute; bottom:20px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 15px;
            z-index:40; pointer-events:none;
        }
        .ctrl-group { display:flex; gap:20px; pointer-events:auto; }
        .ctrl-btn {
            width:55px; height:55px; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.5);
            border-radius:50%; color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
            transition:background 0.1s; touch-action:manipulation;
        }
        .ctrl-btn:active { background:rgba(255,255,255,0.35); }
        #btn-jump { width:65px; height:65px; font-size:28px; }
        @media (min-width: 900px) {
            #mobile-controls { display:none; }
        }
        #main-menu, #shop-screen, #promo-screen, #class-select-screen, #game-over-screen, #admin-menu {
            position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:100;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; padding:20px;
        }
        .menu-btn, .buy-btn, .admin-btn {
            padding:12px 20px; font-size:18px; cursor:pointer; background:#3a3a3a; color:#fff; border:3px solid #777;
            border-bottom:6px solid #444; font-family:'Courier New',monospace; font-weight:bold; letter-spacing:2px;
            border-radius:8px; width:200px; text-align:center; text-shadow:1px 1px 0 #000;
        }
        .buy-btn { background:#5a5; border-color:#3a3; }
        .buy-btn:disabled { background:#555; border-color:#333; opacity:0.6; }
        .class-cards { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; max-width:800px; }
        .class-card { background:#2a2a2a; border:4px solid #555; border-radius:10px; padding:15px; text-align:center; cursor:pointer; width:150px; position:relative; }
        .class-card:hover { border-color:#ffd700; transform:scale(1.05); }
        .class-card.locked { opacity:0.75; cursor:not-allowed; }
        .class-card.locked:hover { border-color:#f44; transform:none; }
        .price-tag { position:absolute; top:8px; right:8px; background:#f44; color:#fff; padding:2px 8px; border-radius:8px; font-weight:bold; font-size:13px; }
        .hotbar { position:absolute; bottom:15px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(0,0,0,0.85); border:3px solid #555; border-bottom:5px solid #333; padding:4px 6px; border-radius:6px; pointer-events:auto; z-index:25; }
        .hotbar-slot { width:40px; height:40px; background:#8b8b8b; border:2px solid #373737; border-bottom:4px solid #2a2a2a; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; position:relative; }
        .hotbar-slot.active { border-color:#fff; background:#b0b0b0; box-shadow:0 0 12px rgba(255,255,255,0.8); }
        .hotbar-number { position:absolute; top:2px; left:5px; font-size:10px; color:#fff; font-weight:bold; }
        .hotbar-cooldown { position:absolute; bottom:2px; right:4px; font-size:9px; color:#ff0; }
        #hearts-container { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
        .heart { font-size:22px; }
        .heart.empty { opacity:0.3; filter:grayscale(1); }
        #score-display, #wave-display, #coins-display { position:absolute; left:50%; transform:translateX(-50%); color:#fff; font-weight:bold; text-shadow:2px 2px 0 #000; }
        #score-display { top:12px; font-size:20px; }
        #wave-display { top:40px; color:#ffd700; font-size:14px; }
        #coins-display { top:68px; color:#ffd700; font-size:16px; background:rgba(0,0,0,0.6); padding:2px 12px; border-radius:12px; }
        #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:25; pointer-events:none; font-size:26px; color:#fff; text-shadow:0 0 6px rgba(0,0,0,0.8); }
        #quit-btn, #fullscreen-btn { position:absolute; top:12px; right:15px; z-index:30; background:rgba(0,0,0,0.7); color:#fff; border:2px solid #888; padding:6px 14px; font-size:16px; cursor:pointer; border-radius:4px; }
        #fullscreen-btn { right:70px; }
        #charge-bar-container { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:200px; height:10px; background:#222; border-radius:5px; border:2px solid #555; display:none; z-index:22; }
        #charge-bar-fill { height:100%; width:0%; background:#b44dff; border-radius:3px; transition:width 0.05s linear; }
        #spell-indicator { position:absolute; top:95px; left:50%; transform:translateX(-50%); color:#fff; font-size:14px; background:rgba(0,0,0,0.7); padding:2px 10px; border-radius:8px; }
        .music-btn { position:absolute; top:10px; left:10px; z-index:200; background:rgba(0,0,0,0.6); color:#fff; border:1px solid #888; padding:4px 8px; font-size:14px; cursor:pointer; }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="vignette"></div>

    <!-- Мобильные кнопки -->
    <div id="mobile-controls">
        <div class="ctrl-group">
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
        </div>
        <div class="ctrl-group">
            <button class="ctrl-btn" id="btn-jump">▲</button>
        </div>
    </div>

    <div id="main-menu">
        <h1>ЗАЩИТА ДЕРЕВНИ</h1>
        <div class="menu-btn" id="play-btn">▶ ИГРАТЬ</div>
        <div class="menu-btn" id="shop-btn">🛒 МАГАЗИН</div>
        <div class="menu-btn" id="promo-btn">🎫 ПРОМОКОДЫ</div>
        <button class="menu-btn music-btn" id="music-toggle">🔇 ВКЛЮЧИТЬ МУЗЫКУ</button>
    </div>
    <div id="shop-screen" style="display:none">
        <h2>МАГАЗИН 🪙 <span id="shop-coins">0</span></h2>
        <div class="shop-item"><span>+1 макс. здоровье (20🪙)</span><button class="buy-btn" id="buy-health">Купить</button></div>
        <div class="shop-item"><span>⌛ Хлеб быстрее на 60с (30🪙)</span><button class="buy-btn" id="buy-bread">Купить</button></div>
        <button class="menu-btn" id="shop-back">↩ НАЗАД</button>
    </div>
    <div id="promo-screen" style="display:none">
        <h2>ПРОМОКОДЫ</h2>
        <input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД" style="padding:10px;font-size:16px;width:200px;text-align:center;background:#1a1a1a;color:#fff;border:2px solid #555;border-radius:4px;">
        <button class="menu-btn" id="apply-promo">ПРИМЕНИТЬ</button>
        <div id="promo-msg" style="color:#ff0;"></div>
        <button class="menu-btn" id="promo-back">↩ НАЗАД</button>
    </div>
    <div id="class-select-screen" style="display:none"></div>
    <div id="game-over-screen" style="display:none">
        <h2>💀 ИГРА ОКОНЧЕНА 💀</h2>
        <p class="final-score">Счёт: 0</p>
        <p class="final-wave">Волна: 1</p>
        <p class="final-coins" style="color:#ffd700">Монет: 0</p>
        <button class="menu-btn" id="restart-btn">🔄 ИГРАТЬ СНОВА</button>
        <button class="menu-btn" id="menu-btn">🏠 ГЛАВНОЕ МЕНЮ</button>
    </div>
    <div id="admin-menu" style="display:none">
        <h2>🔧 АДМИН-МЕНЮ</h2>
        <select id="mob-select">
            <option value="zombie">Зомби</option><option value="creeper">Крипер</option><option value="skeleton">Скелет</option>
            <option value="spider">Паук</option><option value="enderman">Эндермен</option><option value="boss">Босс Куба</option>
            <option value="dragon">Эндер-дракон</option>
        </select>
        <button class="menu-btn" id="spawn-mob">Спавнить моба</button>
        <button class="menu-btn" id="give-coins">+100 монет</button>
        <button class="menu-btn" id="toggle-god">Бессмертие: ВЫКЛ</button>
        <div><span style="color:#fff;">Уровень:</span><input type="number" id="wave-input" min="1" value="1" style="width:60px;padding:4px;background:#1a1a1a;color:#fff;border:1px solid #555;border-radius:4px;"><button class="menu-btn" id="set-wave">Перейти</button></div>
        <button class="menu-btn" id="unlock-all">Разблокировать всё</button>
        <button class="menu-btn" id="close-admin">ЗАКРЫТЬ</button>
    </div>
    <div id="crosshair" style="display:none">⌖</div>
    <div id="score-display">⚔ 0</div>
    <div id="wave-display">ВОЛНА 1</div>
    <div id="coins-display">🪙 0</div>
    <div id="spell-indicator"></div>
    <div id="charge-bar-container"><div id="charge-bar-fill"></div></div>
    <div id="ui-layer"><div id="hearts-container"></div><div class="hotbar" id="hotbar"></div></div>
    <button id="quit-btn" style="display:none">✖ Выйти</button>
    <button id="fullscreen-btn" style="position:absolute; top:10px; right:10px; z-index:50;">🔲</button>
</div>

<script>
(function() {
    // ========== КОНФИГУРАЦИЯ ==========
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 600;
    canvas.width = W; canvas.height = H;

    const GROUND_Y = H - 80;
    const MOVE_SPEED = 5;
    const JUMP_POWER = -12;
    const GRAVITY = 0.6;
    const ARROW_SPEED = 12;

    const MOB_TYPES = {
        zombie:  { name:'Зомби', color:'#4a8c6f', hp:2, speed:0.6, size:32, points:10, damage:1, armorColor:'#3a6b55' },
        creeper: { name:'Крипер', color:'#5d9b3a', hp:1, speed:0.9, size:28, points:20, damage:2, armorColor:'#4a7d2e', explodes:true },
        skeleton:{ name:'Скелет', color:'#c4c4c4', hp:1, speed:0.5, size:30, points:15, damage:1, armorColor:'#a0a0a0', shoots:true },
        spider:  { name:'Паук', color:'#3d2b1f', hp:2, speed:1.1, size:26, points:15, damage:1, armorColor:'#2a1f16' },
        enderman:{ name:'Эндермен', color:'#1a1a1a', hp:4, speed:0.7, size:34, points:50, damage:3, armorColor:'#000' }
    };

    const CLASSES = {
        steve:    { name:'Стив',   avatar:'🧑', skills:['🏹','🗡️','🍞'],   skillIds:['bow','sword','bread'], baseHealth:10 },
        gunsmith:{ name:'Оружейник', avatar:'🔫', skills:['🔫','💥','💣','🚀','💣'], skillIds:['rifle','shotgun','grenade','rpg','mine'], baseHealth:10 },
        sukuna:  { name:'Сукуна', avatar:'👹', skills:['⚡','🌀','🌌'],   skillIds:['slash','cleave','worldslash'], baseHealth:10 },
        mage:    { name:'Годжо',  avatar:'🧙', skills:['🔴','🔵','🟣'],   skillIds:['red','blue','purple'], baseHealth:10 },
        choso:   { name:'Чосо',   avatar:'🩸', skills:['➹','☔','📌','💥','🧊'], skillIds:['arrow','rain','spike','burst','control'], baseHealth:10 },
        mahito:  { name:'Махито', avatar:'👤', skills:['🌀','👁️','🌑','✨','👻'], skillIds:['distortion','transfigure','domain','teleport','soul'], baseHealth:10 },
        dragon:  { name:'Дракон', avatar:'🐉', skills:['🔥','🌀','🌪️','💎','⚡'], skillIds:['breath','rift','storm','crystals','rage'], baseHealth:10 }
    };

    const ABILITIES = {
        steve: {
            bow:   { cast: ()=>shootArrow(), cd:18, key:'shoot' },
            sword: { cast: ()=>meleeAttack(), cd:10, key:'melee' },
            bread: { cast: ()=>useBread(), cd:15, key:'bread', ext:'bread' }
        },
        gunsmith: {
            rifle:   { cast: ()=>castRifle(), cd:5, key:'rifle' },
            shotgun: { cast: ()=>castShotgun(), cd:20, key:'shotgun' },
            grenade: { cast: ()=>castGrenade(), cd:30, key:'grenade' },
            rpg:     { charge:true, chargeType:'rpg', chargeMax:180, cd:40, key:'rpg' },
            mine:    { cast: ()=>castMine(), cd:10, key:'mine' }
        },
        sukuna: {
            slash:      { cast: ()=>castSukunaSlash(), cd:10, key:'slash' },
            cleave:     { cast: ()=>castSukunaCleave(), cd:20, key:'cleave' },
            worldslash: { charge:true, chargeType:'worldslash', chargeMax:180, cd:30, key:'worldslash' }
        },
        mage: {
            red:    { cast: ()=>castRedSpell(), cd:20, key:'shoot' },
            blue:   { cast: ()=>castBlueVortex(), cd:90, key:'shoot' },
            purple: { charge:true, chargeType:'purple', chargeMax:300, cd:25, key:'purple', ext:'purple' }
        },
        choso: {
            arrow:  { cast: ()=>castBloodArrow(), cd:20, key:'shoot' },
            rain:   { cast: ()=>castBloodRain(), cd:60, key:'shoot' },
            spike:  { cast: ()=>castBloodSpike(), cd:45, key:'shoot' },
            burst:  { charge:true, chargeType:'burst', chargeMax:300, cd:30, key:'burst', ext:'burst' },
            control:{ cast: ()=>castBloodControl(), cd:50, key:'shoot' }
        },
        mahito: {
            distortion:  { cast: ()=>castDistortion(), cd:15, key:'distortion' },
            transfigure: { cast: ()=>castTransfigure(), cd:15, key:'transfigure' },
            domain:      { charge:true, chargeType:'domain', chargeMax:300, cd:30, key:'domain', ext:'domain' },
            teleport:    { cast: ()=>castTeleport(), cd:10, key:'teleport' },
            soul:        { cast: ()=>castSoulStrike(), cd:25, key:'soul' }
        },
        dragon: {
            breath:   { cast: ()=>castDragonBreath(), cd:10, key:'breath' },
            rift:     { cast: ()=>castShadowRift(), cd:20, key:'rift' },
            storm:    { cast: ()=>castWingStorm(), cd:30, key:'storm' },
            crystals: { cast: ()=>castDragonCrystals(), cd:30, key:'crystals' },
            rage:     { charge:true, chargeType:'rage', chargeMax:300, cd:35, key:'rage', ext:'rage' }
        }
    };

    // ========== СОСТОЯНИЕ ИГРЫ ==========
    let playerClass = null;
    let maxHealth = 10, health = 10;
    let score = 0, wave = 1, coins = 0;
    let gameOver = false;
    let playerX = W/2, playerY = GROUND_Y, playerVY = 0, isOnGround = true;
    let mouseX = W/2, mouseY = H/2;
    let currentSkillIndex = 0, skillNames = [];
    let isCharging = false, chargeTimer = 0, currentChargeMax = 300, chargeType = null;
    let isMouseDown = false;
    let shakeAmount = 0, frameCount = 0;
    let mobs = [], redSpells = [], blueVortexes = [], arrows = [], particles = [], floatingTexts = [], alliedMobs = [], mines = [];
    let boss = null;
    let godMode = false;
    let healthBonus = 0, breadReduction = 0;
    let unlockedCharacters = { steve:true, mage:false, sukuna:false, choso:false, mahito:false, gunsmith:false, dragon:false };
    let keyA = false, keyD = false, keyJump = false;

    let cd = { shoot:0, melee:0, bread:0, purple:0, slash:0, cleave:0, worldslash:0,
               rifle:0, shotgun:0, grenade:0, rpg:0, mine:0,
               burst:0, domain:0, rage:0, breath:0, rift:0, storm:0, crystals:0,
               distortion:0, transfigure:0, teleport:0, soul:0 };

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function createMob(type) {
        const t = MOB_TYPES[type];
        const side = Math.floor(Math.random()*3);
        let sx, sy;
        if (side===0) { sx = Math.random()*(W-200)+100; sy = -40-Math.random()*60; }
        else if (side===1) { sx = -40-Math.random()*40; sy = Math.random()*(H*0.6)+30; }
        else { sx = W+40+Math.random()*40; sy = Math.random()*(H*0.6)+30; }
        return {
            type, x:sx, y:sy, hp:t.hp, maxHp:t.hp,
            speed: t.speed + (wave-1)*0.08, size:t.size, points:t.points, damage:t.damage,
            color:t.color, armorColor:t.armorColor, explodes:t.explodes||false, shoots:t.shoots||false,
            shootTimer:0, shootDelay:120+Math.random()*60, wobble:Math.random()*Math.PI*2,
            flashTimer:0, teleported:false, walkPhase:Math.random()*Math.PI*2, spawnAnim:15
        };
    }

    function createAlliedMob(source) {
        alliedMobs.push({ x:source.x, y:source.y, hp:3, size:source.size, speed:source.speed*0.8, damage:1, color:source.color, life:300, walkPhase:Math.random()*Math.PI*2 });
    }

    function createExplosion(x,y,color,count=25) {
        for(let i=0;i<count;i++){ let a=Math.random()*Math.PI*2, sp=2+Math.random()*8; particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:15+Math.random()*25,color,size:2+Math.random()*6}); }
        particles.push({x,y,vx:0,vy:0,life:6,color:'#fff',size:20+Math.random()*20,isFlash:true});
        shakeAmount = Math.max(shakeAmount,8);
    }

    function addFloatingText(x,y,text,color='#fff') { floatingTexts.push({x,y,text,life:30,color,vy:-3}); }

    function damagePlayer(amount) {
        if(gameOver||godMode) return;
        health -= amount;
        shakeAmount = Math.max(shakeAmount,12);
        for(let i=0;i<15;i++) particles.push({x:playerX,y:playerY,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:10+Math.random()*10,color:'#f44',size:3+Math.random()*5});
        addFloatingText(playerX,playerY-20,'-'+amount,'#ff4444');
        if(health<=0){ health=0; endGame(); }
        updateHearts();
    }

    function endGame() {
        gameOver=true;
        document.getElementById('game-over-screen').style.display='block';
        document.getElementById('final-score').textContent='Счёт: '+score;
        document.getElementById('final-wave').textContent='Волна: '+wave;
        document.getElementById('final-coins').textContent='Монет: '+coins;
        document.getElementById('crosshair').style.display='none';
        document.getElementById('charge-bar-container').style.display='none';
        document.getElementById('quit-btn').style.display='none';
        isCharging=false; chargeType=null;
    }

    function resetGameState() {
        score=0; wave=1; health=maxHealth; gameOver=false;
        shakeAmount=0; isCharging=false; chargeType=null;
        for(let k in cd) cd[k]=0;
        mobs=[]; redSpells=[]; blueVortexes=[]; arrows=[]; particles=[]; floatingTexts=[]; alliedMobs=[]; mines=[]; boss=null;
        playerVY=0; isOnGround=true;
        document.getElementById('score-display').textContent='⚔ 0';
        document.getElementById('wave-display').textContent='ВОЛНА 1';
        updateCoinsDisplay(); updateHearts();
    }

    function restartGame() {
        resetGameState();
        document.getElementById('game-over-screen').style.display='none';
        document.getElementById('crosshair').style.display='block';
        document.getElementById('quit-btn').style.display='block';
        spawnWave();
    }

    function goToMainMenu() {
        playerClass=null; gameOver=false;
        document.getElementById('main-menu').style.display='flex';
        document.getElementById('shop-screen').style.display='none';
        document.getElementById('promo-screen').style.display='none';
        document.getElementById('class-select-screen').style.display='none';
        document.getElementById('game-over-screen').style.display='none';
        document.getElementById('crosshair').style.display='none';
        document.getElementById('quit-btn').style.display='none';
        document.getElementById('hotbar').innerHTML='';
        document.getElementById('spell-indicator').textContent='';
        resetGameState();
    }

    function updateHearts() {
        let html='';
        for(let i=0;i<maxHealth;i++) html += i<health ? '<span class="heart">❤️</span>' : '<span class="heart empty">🖤</span>';
        document.getElementById('hearts-container').innerHTML=html;
    }

    function updateCoinsDisplay() {
        document.getElementById('coins-display').textContent='🪙 '+coins;
        document.getElementById('shop-coins').textContent=coins;
    }

    // ========== ИГРОВЫЕ МЕХАНИКИ ==========
    function shootArrow() {
        let dx=mouseX-playerX, dy=mouseY-playerY, dist=Math.hypot(dx,dy)||1;
        arrows.push({x:playerX,y:playerY-10,vx:dx/dist*ARROW_SPEED,vy:dy/dist*ARROW_SPEED,life:80,trail:[]});
        shakeAmount=3;
    }

    function meleeAttack() {
        for(let i=mobs.length-1;i>=0;i--) {
            let m=mobs[i];
            if(Math.hypot(m.x-playerX,m.y-playerY)<50) {
                m.hp-=2; m.flashTimer=6;
                if(m.hp<=0){ createExplosion(m.x,m.y,m.color,20); score+=m.points; mobs.splice(i,1); }
            }
        }
        document.getElementById('score-display').textContent='⚔ '+score;
    }

    function useBread() { health=Math.min(maxHealth,health+3); updateHearts(); }

    function castRedSpell() {
        let dx=mouseX-playerX, dy=mouseY-playerY, dist=Math.hypot(dx,dy)||1;

    function finishCharge() {
        if(chargeType==='purple') castPurpleBeam();
        else if(chargeType==='worldslash') castWorldSlash();
        else if(chargeType==='burst') castBloodBurst();
        else if(chargeType==='domain') castMahitoDomain();
        else if(chargeType==='rpg') castRPG();
        else if(chargeType==='rage') castDragonRage();
        isCharging=false; chargeType=null;
        document.getElementById('charge-bar-container').style.display='none';
    }

    // ========== АКТИВАЦИЯ СПОСОБНОСТЕЙ ==========
    function useAbility() {
        if(gameOver || cd.shoot>0 || isCharging) return;
        const skillId = CLASSES[playerClass].skillIds[currentSkillIndex];
        const ab = ABILITIES[playerClass][skillId];
        if(!ab) return;

        if(ab.charge) {
            isCharging=true; chargeTimer=0; currentChargeMax=ab.chargeMax;
            chargeType=ab.chargeType;
            document.getElementById('charge-bar-container').style.display='block';
            document.getElementById('charge-bar-fill').style.width='0%';
            document.getElementById('charge-bar-fill').style.background = ab.chargeType==='purple'?'#b44dff':'#ff4444';
            return;
        }

        if(ab.ext && cd[ab.ext]>0) return;
        if(!ab.ext && cd[ab.key]>0) return;

        if(ab.cast) ab.cast();

        if(ab.ext) cd[ab.ext] = ab.cd;
        else cd[ab.key] = ab.cd;
        cd.shoot = ab.cd;
    }

    // ========== ВОЛНЫ И БОССЫ ==========
    function spawnBoss() {
        if(wave===5) boss = { type:'cube', x:W/2, y:100, hp:60, maxHp:60, size:50, color:'#ff8800', phase:1, shootTimer:0, shootDelay:40, wallTimer:0, wallDuration:150, wallsActive:false, spikeUnderTimer:0, spikeUnderDelay:70, waveActive:false, waveY:-30, spawnAnim:30 };
        else if(wave===10) boss = { type:'dragon', x:W/2, y:80, hp:120, maxHp:120, size:60, color:'#222222', shootTimer:0, shootDelay:30, flameTimer:0, flameActive:false, diveTimer:0, diveActive:false, diveTargetX:0, spawnAnim:30 };
    }

    function spawnWave() {
        waveTotalMobs = 4 + wave * 3;
        waveMobsRemaining = waveTotalMobs;
        mobSpawnDelay = Math.max(20, 80 - wave * 4);
        mobSpawnTimer = 0;
        waveTransition = false; waveTransitionTimer = 0;
        mobs=[]; redSpells=[]; blueVortexes=[]; arrows=[]; particles=[]; floatingTexts=[]; alliedMobs=[]; mines=[];
        if(wave===5 || wave===10) spawnBoss(); else boss=null;
    }

    let waveTotalMobs, waveMobsRemaining, mobSpawnDelay, mobSpawnTimer=0, waveTransition=false, waveTransitionTimer=0;

    // ========== UI И КЛАССЫ ==========
    function setupUIForClass() {
        const cls = CLASSES[playerClass];
        skillNames = cls.skills;
        maxHealth = cls.baseHealth + healthBonus;
        health = maxHealth;
        const hotbarEl = document.getElementById('hotbar');
        hotbarEl.innerHTML = '';
        cls.skills.forEach((icon,i)=>{
            const slot = document.createElement('div');
            slot.className = 'hotbar-slot' + (i===0?' active':'');
            slot.innerHTML = `<span class="hotbar-number">${i+1}</span><span class="item-icon">${icon}</span>`;
            slot.addEventListener('click', ()=>{ currentSkillIndex=i; updateHotbar(); });
            hotbarEl.appendChild(slot);
        });
        currentSkillIndex=0;
        updateHotbar();
        document.getElementById('spell-indicator').textContent = cls.skills[0];
    }

    function updateHotbar() {
        document.querySelectorAll('.hotbar-slot').forEach((s,i)=> s.classList.toggle('active', i===currentSkillIndex));
        if(skillNames.length) document.getElementById('spell-indicator').textContent = skillNames[currentSkillIndex];
    }

    function renderClassSelection() {
        const screen = document.getElementById('class-select-screen');
        screen.innerHTML = '<h1>ВЫБЕРИТЕ ГЕРОЯ</h1><div class="class-cards"></div>';
        const cards = screen.querySelector('.class-cards');
        const heroes = [
            { cls:'steve',    name:'Стив',   avatar:'🧑', price:0 },
            { cls:'gunsmith', name:'Оружейник', avatar:'🔫', price:200 },
            { cls:'sukuna',   name:'Сукуна', avatar:'👹', price:75 },
            { cls:'mage',     name:'Годжо',  avatar:'🧙', price:50 },
            { cls:'choso',    name:'Чосо',   avatar:'🩸', price:333 },
            { cls:'mahito',   name:'Махито', avatar:'👤', price:500 },
            { cls:'dragon',   name:'Дракон', avatar:'🐉', price:9999, codeOnly:true }
        ];
        heroes.forEach(h=>{
            const card = document.createElement('div');
            card.className = 'class-card' + (!unlockedCharacters[h.cls] ? ' locked' : '');
            card.innerHTML = `<div class="avatar">${h.avatar}</div><h2>${h.name}</h2>`;
            if(!unlockedCharacters[h.cls]) {
                if(h.codeOnly) card.innerHTML += '<div class="price-tag">КОД</div><p style="font-size:11px;color:#ccc;">Промокод DRAGON</p>';
                else card.innerHTML += `<div class="price-tag">${h.price}🪙</div><button class="buy-character-btn" data-cls="${h.cls}">Купить</button>`;
            } else card.addEventListener('click', ()=> startGameWithClass(h.cls));
            cards.appendChild(card);
        });
        document.querySelectorAll('.buy-character-btn').forEach(btn=>{
            btn.addEventListener('click', (e)=>{
                e.stopPropagation();
                const cls = btn.dataset.cls;
                const prices = { mage:50, sukuna:75, choso:333, mahito:500, gunsmith:200 };
                if(coins >= prices[cls]) { coins -= prices[cls]; unlockedCharacters[cls]=true; updateCoinsDisplay(); renderClassSelection(); }
            });
        });
    }

    function startGameWithClass(cls) {
        playerClass = cls;
        document.getElementById('class-select-screen').style.display='none';
        document.getElementById('crosshair').style.display='block';
        document.getElementById('quit-btn').style.display='block';
        setupUIForClass();
        resetGameState();
        spawnWave();
    }

    // ========== ГЛАВНЫЙ ЦИКЛ ==========
    function decreaseCooldowns() {
        for(let k in cd) if(cd[k]>0) cd[k]--;
        if(shakeAmount>0) shakeAmount*=0.85;
    }

    function handlePlayerMovement() {
        let dx=0;
        if(keyA) dx-=MOVE_SPEED; if(keyD) dx+=MOVE_SPEED;
        playerX += dx; playerX = Math.max(60, Math.min(W-60, playerX));
        playerVY += GRAVITY; playerY += playerVY;
        if(playerY >= GROUND_Y){ playerY=GROUND_Y; playerVY=0; isOnGround=true; }
        else isOnGround=false;
        if(keyJump && isOnGround){ playerVY=JUMP_POWER; isOnGround=false; }
    }

    function handleCharging() {
        if(!isCharging) return;
        if(!isMouseDown) { isCharging=false; chargeType=null; document.getElementById('charge-bar-container').style.display='none'; return; }
        chargeTimer++;
        document.getElementById('charge-bar-fill').style.width = (chargeTimer/currentChargeMax*100)+'%';
        if(chargeTimer >= currentChargeMax) finishCharge();
    }

    function updateBoss() {
        if(!boss) return;
        if(boss.spawnAnim>0) boss.spawnAnim--;
        if(boss.type==='cube') {
            boss.shootTimer++; if(boss.shootTimer>=boss.shootDelay){ boss.shootTimer=0; let a=Math.atan2(playerY-boss.y,playerX-boss.x); redSpells.push({x:boss.x,y:boss.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,life:100,color:'#ff4400',isEnemy:true,size:6,trail:[]}); }
            if(boss.hp<=30 && boss.phase===1){ boss.phase=2; boss.wallsActive=true; boss.wallTimer=boss.wallDuration; addFloatingText(boss.x,boss.y-40,'Фаза 2!','#ff8800'); }
            if(boss.phase===2){
                if(boss.wallsActive){ boss.wallTimer--; if(boss.wallTimer<=0){ boss.wallsActive=false; boss.wallTimer=boss.wallDuration; } }
                boss.spikeUnderTimer++; if(boss.spikeUnderTimer>=boss.spikeUnderDelay){ boss.spikeUnderTimer=0; for(let i=0;i<3;i++) particles.push({x:playerX+(i-1)*25,y:playerY+20,vx:0,vy:-8,life:25,color:'#ff6600',size:5,isEnemy:true}); }
                if(!boss.waveActive && Math.random()<0.02){ boss.waveActive=true; boss.waveY=0; }
            }
            if(boss.waveActive){ boss.waveY+=3; if(boss.waveY>H) boss.waveActive=false; }
        } else if(boss.type==='dragon') {
            boss.shootTimer++; if(boss.shootTimer>=boss.shootDelay){ boss.shootTimer=0; let a=Math.atan2(playerY-boss.y,playerX-boss.x); redSpells.push({x:boss.x,y:boss.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,life:80,color:'#ff00ff',isEnemy:true,size:8,trail:[]}); }
            boss.flameTimer++; if(boss.flameTimer>=180){ boss.flameActive=true; boss.flameTimer=0; } if(boss.flameActive){ boss.flameTimer++; if(boss.flameTimer<60) for(let i=0;i<3;i++) particles.push({x:boss.x+Math.random()*100-50,y:boss.y+40,vx:0,vy:3,life:20,color:'#ff44ff',size:5,isEnemy:true}); else boss.flameActive=false; }
            if(boss.hp<60 && !boss.diveActive && Math.random()<0.01){ boss.diveActive=true; boss.diveTargetX=playerX; boss.diveTimer=40; }
            if(boss.diveActive){ boss.x+=(boss.diveTargetX-boss.x)*0.1; boss.y+=(playerY-boss.y)*0.05; boss.diveTimer--; if(boss.diveTimer<=0) boss.diveActive=false; }
            if(!boss.diveActive){ boss.x+=(playerX-boss.x)*0.02; boss.y+=(80-boss.y)*0.02; }
        }
    }

    function spawnMobsLogic() {
        if(waveTransition || waveMobsRemaining<=0) return;
        mobSpawnTimer++; if(mobSpawnTimer>=mobSpawnDelay){
            mobSpawnTimer=0; const types=['zombie','creeper','skeleton','spider']; if(wave>=3) types.push('enderman');
            mobs.push(createMob(types[Math.floor(Math.random()*types.length)]));
            waveMobsRemaining--;
        }
    }

    function checkWaveTransition() {
        if(!waveTransition && waveMobsRemaining<=0 && mobs.length===0 && !boss){
            waveTransition=true; waveTransitionTimer=60; wave++; document.getElementById('wave-display').textContent='ВОЛНА '+wave;
            coins+=10; updateCoinsDisplay(); addFloatingText(W/2,H/2,'ВОЛНА '+wave+'! +10🪙','#ffd700');
            health=Math.min(maxHealth,health+2); updateHearts();
        }
        if(waveTransition){ waveTransitionTimer--; if(waveTransitionTimer<=0) spawnWave(); }
    }

    function updateProjectiles() {
        const proj = playerClass==='steve'?arrows:redSpells;
        for(let p of proj){
            p.x+=p.vx; p.y+=p.vy; p.life--;
            if(p.trail){ p.trail.push({x:p.x,y:p.y}); if(p.trail.length>8) p.trail.shift(); }
            if(boss && Math.hypot(p.x-boss.x,p.y-boss.y)<30 && !p.isEnemy){
                let dmg=1; if(p.isRPG) dmg=4; if(p.isWorldSlash) dmg=5;
                boss.hp-=dmg; createExplosion(p.x,p.y,'#ff0',8); p.life=0;
                if(boss.hp<=0){ score+=100; document.getElementById('score-display').textContent='⚔ '+score; createExplosion(boss.x,boss.y,boss.type==='dragon'?'#ff00ff':'#ff8800',40); boss=null; }
            }
            for(let i=mobs.length-1;i>=0;i--){
                let m=mobs[i]; if(Math.hypot(p.x-m.x,p.y-m.y)<m.size/2+10){
                    let dmg=1; if(p.isGrenade) dmg=2; if(p.isRPG) dmg=3; if(p.isWorldSlash) dmg=4;
                    m.hp-=dmg; m.flashTimer=4;
                    if(m.hp<=0){
                        if(p.isTransfigure){ createAlliedMob(m); mobs.splice(i,1); score+=m.points; }
                        else { createExplosion(m.x,m.y,m.color,25); score+=m.points; mobs.splice(i,1); }
                        document.getElementById('score-display').textContent='⚔ '+score;
                    }
                    createExplosion(p.x,p.y,'#ff4d4d',12); p.life=0; break;
                }
            }
        }
        if(playerClass==='steve') arrows=arrows.filter(a=>a.life>0); else redSpells=redSpells.filter(s=>s.life>0);
    }

    function updateVortexes() {
        for(let v of blueVortexes){
            v.duration--; v.tickTimer++;
            mobs.forEach(m=>{ let dx=v.x-m.x,dy=v.y-m.y,dist=Math.hypot(dx,dy); if(dist<v.radius){ let f=0.15*(1-dist/v.radius); m.x+=dx/dist*f*3; m.y+=dy/dist*f*3; } });
            if(v.tickTimer>=v.tickInterval){ v.tickTimer=0; for(let i=mobs.length-1;i>=0;i--){ let m=mobs[i]; if(Math.hypot(v.x-m.x,v.y-m.y)<v.radius){ m.hp-=1; if(m.hp<=0){ createExplosion(m.x,m.y,m.color,25); score+=m.points; mobs.splice(i,1); } } } }
        }
        blueVortexes=blueVortexes.filter(v=>v.duration>0);
    }

    function updateMines() {
        for(let mine of mines){
            if(mine.timer>0){ mine.timer--; continue; }
            if(!mine.armed){ mine.armed=true; continue; }
            for(let m of mobs){ if(Math.hypot(m.x-mine.x,m.y-mine.y)<mine.radius){ createExplosion(mine.x,mine.y,'#ffaa00',20); m.hp-=mine.damage; if(m.hp<=0){ createExplosion(m.x,m.y,m.color,15); score+=m.points; mobs=mobs.filter(x=>x!==m); } mine.exploded=true; break; } }
        }
        mines=mines.filter(m=>!m.exploded);
    }

    function updateMobs() {
        mobs.forEach(m=>{
            if(m.spawnAnim>0) m.spawnAnim--;
            let dx=playerX-m.x, dy=playerY-m.y, dist=Math.hypot(dx,dy);
            m.walkPhase+=0.15; m.x+=dx/dist*m.speed; m.y+=dy/dist*m.speed;
            if(dist<35 && !gameOver){
                if(m.explodes){ createExplosion(m.x,m.y,'#5d9b3a',40); damagePlayer(m.damage); m.hp=0; shakeAmount=20; }
                else { damagePlayer(m.damage); m.x-=dx/dist*40; m.y-=dy/dist*40; }
            }
            if(m.shoots){ m.shootTimer++; if(m.shootTimer>=m.shootDelay && dist<400){ m.shootTimer=0; let ep={x:m.x,y:m.y,vx:dx/dist*ARROW_SPEED*0.7,vy:dy/dist*ARROW_SPEED*0.7,life:60,trail:[],isEnemy:true}; if(playerClass==='steve') arrows.push(ep); else redSpells.push(ep); } }
        });
        mobs=mobs.filter(m=>m.hp>0);
    }

    function updateAlliedMobs() {
        alliedMobs.forEach(a=>{
            a.life--; if(a.life<=0) return;
            a.walkPhase+=0.15; let target=null,cdist=Infinity;
            for(let m of mobs){ let d=Math.hypot(a.x-m.x,a.y-m.y); if(d<cdist){ cdist=d; target=m; } }
            if(target){ let dx=target.x-a.x,dy=target.y-a.y,dist=Math.hypot(dx,dy)||1; a.x+=dx/dist*a.speed; a.y+=dy/dist*a.speed; if(dist<25){ target.hp-=a.damage; if(target.hp<=0){ createExplosion(target.x,target.y,target.color,15); score+=target.points; mobs=mobs.filter(m=>m!==target); } } }
        });
        alliedMobs=alliedMobs.filter(a=>a.life>0);
    }

    function processEnemyProjectiles() {
        const enemyProj = playerClass==='steve'?arrows.filter(a=>a.isEnemy):redSpells.filter(s=>s.isEnemy);
        enemyProj.forEach(ep=>{ if(Math.hypot(ep.x-playerX,ep.y-playerY)<22){ damagePlayer(1); ep.life=0; createExplosion(ep.x,ep.y,'#f44',8); } });
    }

    function updateParticlesAndTexts() {
        particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; if(!p.isFlash) p.vy+=0.2; p.size*=0.96; });
        particles=particles.filter(p=>p.life>0);
        floatingTexts.forEach(ft=>{ ft.y+=ft.vy; ft.life--; });
        floatingTexts=floatingTexts.filter(ft=>ft.life>0);
    }

    function update() {
        if(gameOver||!playerClass) return;
        frameCount++;
        decreaseCooldowns();
        handlePlayerMovement();
        handleCharging();
        updateBoss();
        spawnMobsLogic();
        checkWaveTransition();
        updateProjectiles();
        updateVortexes();
        updateMines();
        updateMobs();
        updateAlliedMobs();
        processEnemyProjectiles();
        updateParticlesAndTexts();
    }

    // ========== ОТРИСОВКА ==========
    function drawBackground() {
        const grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,'#7ec8f8'); grad.addColorStop(0.55,'#b8e0fc'); grad.addColorStop(1,'#c8e8ff');
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    }

    function drawMob(mob) {
        ctx.save(); let x=Math.floor(mob.x), y=Math.floor(mob.y), s=mob.size;
        let wobX=Math.sin(frameCount*0.15+mob.wobble)*3, wobY=Math.cos(frameCount*0.12+mob.wobble)*2;
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x-s/2+3,y+s/2-4,s-2,6);
        let bc=mob.flashTimer>0?'#fff':mob.color; if(mob.flashTimer>0) mob.flashTimer--;
        if(mob.type==='enderman'){
            ctx.fillStyle=bc; ctx.fillRect(x-s/2,y-s/2,s,s*1.2);
            ctx.fillStyle='#e066ff'; ctx.fillRect(x-s/4-2,y-s/3,4,4); ctx.fillRect(x+s/4-2,y-s/3,4,4);
        } else if(mob.type==='skeleton'){
            ctx.fillStyle=bc; ctx.fillRect(x-s/2,y-s/2,s,s);
        } else {
            ctx.fillStyle=bc; ctx.fillRect(x-s/2,y-s/2,s,s);
        }
        if(mob.hp<mob.maxHp){ let bw=s,bh=4,by=y-s/2-10; ctx.fillStyle='#333'; ctx.fillRect(x-bw/2,by,bw,bh); ctx.fillStyle=mob.hp>0?'#5f5':'#f55'; ctx.fillRect(x-bw/2,by,bw*(mob.hp/mob.maxHp),bh); }
        ctx.restore();
    }

    function drawPlayer() {
        let px=playerX, py=playerY;
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(px-16,py+14,32,8);
        ctx.fillStyle=playerClass==='sukuna'?'#3d2b1f':'#4d7cb8'; ctx.fillRect(px-10,py-18,20,28);
    }

    function draw() {
        ctx.clearRect(0,0,W,H);
        let sx=0,sy=0; if(shakeAmount>0.5){ sx=(Math.random()-0.5)*shakeAmount*2; sy=(Math.random()-0.5)*shakeAmount*2; }
        ctx.save(); ctx.translate(sx,sy);
        drawBackground();
        mobs.forEach(m=>drawMob(m));
        drawPlayer();
        ctx.restore();
    }

    function gameLoop() { if(playerClass) { update(); draw(); } requestAnimationFrame(gameLoop); }

    // ========== МОБИЛЬНОЕ УПРАВЛЕНИЕ ==========
    function setupMobileControls() {
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');

        function addMultiEvent(el, events, handler) {
            events.split(' ').forEach(e => el.addEventListener(e, handler, {passive: false}));
        }

        addMultiEvent(btnLeft, 'mousedown touchstart', (e) => { e.preventDefault(); keyA = true; });
        addMultiEvent(btnLeft, 'mouseup mouseleave touchend touchcancel', (e) => { e.preventDefault(); keyA = false; });

        addMultiEvent(btnRight, 'mousedown touchstart', (e) => { e.preventDefault(); keyD = true; });
        addMultiEvent(btnRight, 'mouseup mouseleave touchend touchcancel', (e) => { e.preventDefault(); keyD = false; });

        addMultiEvent(btnJump, 'mousedown touchstart', (e) => { e.preventDefault(); keyJump = true; });
        addMultiEvent(btnJump, 'mouseup mouseleave touchend touchcancel', (e) => { e.preventDefault(); keyJump = false; });
    }

    // Прицеливание и стрельба через касания
    const container = document.getElementById('game-container');
    container.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        if (!touch) return;
        const rect = canvas.getBoundingClientRect();
        mouseX = (touch.clientX - rect.left) * (W / rect.width);
        mouseY = (touch.clientY - rect.top) * (H / rect.height);
        isMouseDown = true;
        useAbility();
    });
    container.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        if (!touch) return;
        const rect = canvas.getBoundingClientRect();
        mouseX = (touch.clientX - rect.left) * (W / rect.width);
        mouseY = (touch.clientY - rect.top) * (H / rect.height);
        document.getElementById('crosshair').style.left = (e.touches[0].clientX - rect.left) + 'px';
        document.getElementById('crosshair').style.top = (e.touches[0].clientY - rect.top) + 'px';
    });
    container.addEventListener('touchend', (e) => { e.preventDefault(); isMouseDown = false; });
    container.addEventListener('touchcancel', (e) => { e.preventDefault(); isMouseDown = false; });

    // Мышь для десктопа
    container.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) * (W / rect.width);
        mouseY = (e.clientY - rect.top) * (H / rect.height);
        document.getElementById('crosshair').style.left = (e.clientX - rect.left) + 'px';
        document.getElementById('crosshair').style.top = (e.clientY - rect.top) + 'px';
    });
    container.addEventListener('mousedown', (e) => { if(e.button===0) { isMouseDown=true; useAbility(); } });
    container.addEventListener('mouseup', (e) => { if(e.button===0) isMouseDown=false; });

    // ========== СОБЫТИЯ И ИНИЦИАЛИЗАЦИЯ ==========
    document.getElementById('play-btn').onclick=()=>{ document.getElementById('main-menu').style.display='none'; renderClassSelection(); document.getElementById('class-select-screen').style.display='flex'; };
    document.getElementById('shop-btn').onclick=()=>{ document.getElementById('main-menu').style.display='none'; document.getElementById('shop-screen').style.display='flex'; updateCoinsDisplay(); };
    document.getElementById('shop-back').onclick=()=>{ document.getElementById('shop-screen').style.display='none'; document.getElementById('main-menu').style.display='flex'; };
    document.getElementById('promo-btn').onclick=()=>{ document.getElementById('main-menu').style.display='none'; document.getElementById('promo-screen').style.display='flex'; };
    document.getElementById('promo-back').onclick=()=>{ document.getElementById('promo-screen').style.display='none'; document.getElementById('main-menu').style.display='flex'; };
    document.getElementById('apply-promo').onclick=()=>{ let code=document.getElementById('promo-input').value.trim().toUpperCase(); if(code==='MONEY'){ coins+=50; updateCoinsDisplay(); document.getElementById('promo-msg').textContent='✅ +50 монет!'; } else if(code==='DRAGON'){ unlockedCharacters.dragon=true; document.getElementById('promo-msg').textContent='✅ Дракон разблокирован!'; } else document.getElementById('promo-msg').textContent='❌ Неверный код'; };
    document.getElementById('quit-btn').onclick=goToMainMenu;
    document.getElementById('fullscreen-btn').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); };
    document.addEventListener('keydown', e=>{
        if(e.key==='p'||e.key==='P'){ e.preventDefault(); let adm=document.getElementById('admin-menu'); adm.style.display=adm.style.display==='flex'?'none':'flex'; }
        if(e.code==='KeyA') keyA=true; if(e.code==='KeyD') keyD=true; if(e.code==='Space'){ e.preventDefault(); keyJump=true; }
        if(e.key>='1'&&e.key<='5'&&playerClass){ let idx=parseInt(e.key)-1; if(idx<skillNames.length){ currentSkillIndex=idx; updateHotbar(); } }
    });
    document.addEventListener('keyup', e=>{ if(e.code==='KeyA') keyA=false; if(e.code==='KeyD') keyD=false; if(e.code==='Space'){ e.preventDefault(); keyJump=false; } });
    document.getElementById('restart-btn').onclick=restartGame;
    document.getElementById('menu-btn').onclick=()=>{ document.getElementById('game-over-screen').style.display='none'; goToMainMenu(); };

    // Админ-меню
    document.getElementById('spawn-mob').onclick=()=>{ let t=document.getElementById('mob-select').value; if(t==='boss'){ wave=5; spawnBoss(); } else if(t==='dragon'){ wave=10; spawnBoss(); } else mobs.push(createMob(t)); };
    document.getElementById('give-coins').onclick=()=>{ coins+=100; updateCoinsDisplay(); };
    document.getElementById('toggle-god').onclick=()=>{ godMode=!godMode; document.getElementById('toggle-god').textContent='Бессмертие: '+(godMode?'ВКЛ':'ВЫКЛ'); };
    document.getElementById('set-wave').onclick=()=>{ wave=parseInt(document.getElementById('wave-input').value)||1; document.getElementById('wave-display').textContent='ВОЛНА '+wave; spawnWave(); };
    document.getElementById('unlock-all').onclick=()=>{ for(let k in unlockedCharacters) unlockedCharacters[k]=true; renderClassSelection(); };
    document.getElementById('close-admin').onclick=()=>{ document.getElementById('admin-menu').style.display='none'; };

    // Инициализация
    setupMobileControls();
    updateCoinsDisplay();
    gameLoop();
})();
</script>
</body>
</html>
