<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Защита деревни: Переработанный визуал</title>
    <style>
        :root { --pixel-size: 3px; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#0d0d1a; display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Courier New',monospace; overflow:hidden; user-select:none; }
        #game-container {
            position:relative; width:100vw; height:100vh; max-width:900px; max-height:600px;
            border:6px solid #4a4a4a; box-shadow:0 0 0 4px #1a1a1a, 0 0 0 10px #5a5a5a, 0 0 40px rgba(0,0,0,0.8), inset 0 0 0 2px #2a2a2a;
            background:#000; overflow:hidden; touch-action:none;
        }
        canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
        #vignette { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:11; box-shadow:inset 0 0 60px 30px rgba(0,0,0,0.5); }

        /* Мобильные кнопки */
        #mobile-controls {
            position:absolute; bottom:20px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 15px;
            z-index:40; pointer-events:none;
        }
        .ctrl-group { display:flex; gap:20px; pointer-events:auto; }
        .ctrl-btn {
            width:55px; height:55px; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.5);
            border-radius:50%; color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
            transition:background 0.1s; touch-action:manipulation; user-select:none;
            -webkit-user-select:none; -webkit-touch-callout:none;
        }
        .ctrl-btn:active { background:rgba(255,255,255,0.35); }
        #btn-jump { width:65px; height:65px; font-size:28px; }

        @media (min-width: 900px) {
            #mobile-controls { display:none; }
        }

        /* Интерфейс */
        #main-menu, #shop-screen, #promo-screen, #class-select-screen, #game-over-screen, #admin-menu {
            position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:100;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; padding:20px;
        }
        .menu-btn, .buy-btn, .admin-btn {
            padding:12px 20px; font-size:18px; cursor:pointer; background:#3a3a3a; color:#fff; border:3px solid #777;
            border-bottom:6px solid #444; font-family:'Courier New',monospace; font-weight:bold; letter-spacing:2px;
            border-radius:8px; width:200px; text-align:center; text-shadow:1px 1px 0 #000;
        }
        .buy-btn { background:#5a5; border-color:#3a3; }
        .buy-btn:disabled { background:#555; border-color:#333; opacity:0.6; }
        .class-cards { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; max-width:800px; }
        .class-card { background:#2a2a2a; border:4px solid #555; border-radius:10px; padding:15px; text-align:center; cursor:pointer; width:150px; position:relative; }
        .class-card:hover { border-color:#ffd700; transform:scale(1.05); }
        .class-card.locked { opacity:0.75; cursor:not-allowed; }
        .class-card.locked:hover { border-color:#f44; transform:none; }
        .price-tag { position:absolute; top:8px; right:8px; background:#f44; color:#fff; padding:2px 8px; border-radius:8px; font-weight:bold; font-size:13px; }
        .hotbar { position:absolute; bottom:15px; left:50%; transform:translateX(-50%); display:flex; gap:4px; background:rgba(0,0,0,0.85); border:3px solid #555; border-bottom:5px solid #333; padding:4px 6px; border-radius:6px; pointer-events:auto; z-index:25; }
        .hotbar-slot { width:40px; height:40px; background:#8b8b8b; border:2px solid #373737; border-bottom:4px solid #2a2a2a; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; position:relative; }
        .hotbar-slot.active { border-color:#fff; background:#b0b0b0; box-shadow:0 0 12px rgba(255,255,255,0.8); }
        .hotbar-number { position:absolute; top:2px; left:5px; font-size:10px; color:#fff; font-weight:bold; }
        .hotbar-cooldown { position:absolute; bottom:2px; right:4px; font-size:9px; color:#ff0; }
        #hearts-container { position:absolute; bottom:80px; left:50%; transform:translateX(-50%); display:flex; gap:2px; }
        .heart { font-size:22px; }
        .heart.empty { opacity:0.3; filter:grayscale(1); }
        #score-display, #wave-display, #coins-display { position:absolute; left:50%; transform:translateX(-50%); color:#fff; font-weight:bold; text-shadow:2px 2px 0 #000; }
        #score-display { top:12px; font-size:20px; }
        #wave-display { top:40px; color:#ffd700; font-size:14px; }
        #coins-display { top:68px; color:#ffd700; font-size:16px; background:rgba(0,0,0,0.6); padding:2px 12px; border-radius:12px; }
        #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:25; pointer-events:none; font-size:26px; color:#fff; text-shadow:0 0 6px rgba(0,0,0,0.8); }
        #quit-btn, #fullscreen-btn { position:absolute; top:12px; right:15px; z-index:30; background:rgba(0,0,0,0.7); color:#fff; border:2px solid #888; padding:6px 14px; font-size:16px; cursor:pointer; border-radius:4px; }
        #fullscreen-btn { right:70px; }
        #charge-bar-container { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:200px; height:10px; background:#222; border-radius:5px; border:2px solid #555; display:none; z-index:22; }
        #charge-bar-fill { height:100%; width:0%; background:#b44dff; border-radius:3px; transition:width 0.05s linear; }
        #spell-indicator { position:absolute; top:95px; left:50%; transform:translateX(-50%); color:#fff; font-size:14px; background:rgba(0,0,0,0.7); padding:2px 10px; border-radius:8px; }
        .music-btn { position:absolute; top:10px; left:10px; z-index:200; background:rgba(0,0,0,0.6); color:#fff; border:1px solid #888; padding:4px 8px; font-size:14px; cursor:pointer; }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="vignette"></div>
    <div id="mobile-controls">
        <div class="ctrl-group"><button class="ctrl-btn" id="btn-left">◀</button><button class="ctrl-btn" id="btn-right">▶</button></div>
        <div class="ctrl-group"><button class="ctrl-btn" id="btn-jump">▲</button></div>
    </div>
    <div id="main-menu">
        <h1>ЗАЩИТА ДЕРЕВНИ</h1>
        <div class="menu-btn" id="play-btn">▶ ИГРАТЬ</div>
        <div class="menu-btn" id="shop-btn">🛒 МАГАЗИН</div>
        <div class="menu-btn" id="promo-btn">🎫 ПРОМОКОДЫ</div>
        <button class="menu-btn music-btn" id="music-toggle">🔇 ВКЛЮЧИТЬ МУЗЫКУ</button>
    </div>
    <div id="shop-screen" style="display:none"><h2>МАГАЗИН 🪙 <span id="shop-coins">0</span></h2><div class="shop-item"><span>+1 макс. здоровье (20🪙)</span><button class="buy-btn" id="buy-health">Купить</button></div><div class="shop-item"><span>⌛ Хлеб быстрее на 60с (30🪙)</span><button class="buy-btn" id="buy-bread">Купить</button></div><button class="menu-btn" id="shop-back">↩ НАЗАД</button></div>
    <div id="promo-screen" style="display:none"><h2>ПРОМОКОДЫ</h2><input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД"><button class="menu-btn" id="apply-promo">ПРИМЕНИТЬ</button><div id="promo-msg"></div><button class="menu-btn" id="promo-back">↩ НАЗАД</button></div>
    <div id="class-select-screen" style="display:none"></div>
    <div id="game-over-screen" style="display:none"><h2>💀 ИГРА ОКОНЧЕНА 💀</h2><p class="final-score">Счёт: 0</p><p class="final-wave">Волна: 1</p><p class="final-coins">Монет: 0</p><button class="menu-btn" id="restart-btn">🔄 ИГРАТЬ СНОВА</button><button class="menu-btn" id="menu-btn">🏠 ГЛАВНОЕ МЕНЮ</button></div>
    <div id="admin-menu" style="display:none"><h2>🔧 АДМИН-МЕНЮ</h2><select id="mob-select"><option value="zombie">Зомби</option><option value="creeper">Крипер</option><option value="skeleton">Скелет</option><option value="spider">Паук</option><option value="enderman">Эндермен</option><option value="boss">Босс Куба</option><option value="dragon">Эндер-дракон</option></select><button class="menu-btn" id="spawn-mob">Спавнить моба</button><button class="menu-btn" id="give-coins">+100 монет</button><button class="menu-btn" id="toggle-god">Бессмертие: ВЫКЛ</button><div><span style="color:#fff;">Уровень:</span><input type="number" id="wave-input" min="1" value="1"><button class="menu-btn" id="set-wave">Перейти</button></div><button class="menu-btn" id="unlock-all">Разблокировать всё</button><button class="menu-btn" id="close-admin">ЗАКРЫТЬ</button></div>
    <div id="crosshair" style="display:none">⌖</div>
    <div id="score-display">⚔ 0</div>
    <div id="wave-display">ВОЛНА 1</div>
    <div id="coins-display">🪙 0</div>
    <div id="spell-indicator"></div>
    <div id="charge-bar-container"><div id="charge-bar-fill"></div></div>
    <div id="ui-layer"><div id="hearts-container"></div><div class="hotbar" id="hotbar"></div></div>
    <button id="quit-btn" style="display:none">✖ Выйти</button>
    <button id="fullscreen-btn" style="position:absolute; top:10px; right:10px; z-index:50;">🔲</button>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 600;
    canvas.width = W; canvas.height = H;

    const GROUND_Y = H - 80;
    const MOVE_SPEED = 5;
    const JUMP_POWER = -12;
    const GRAVITY = 0.6;
    const ARROW_SPEED = 12;

    // Улучшенные типы мобов с деталями для отрисовки
    const MOB_TYPES = {
        zombie:  { name:'Зомби', color:'#4a8c6f', hp:2, speed:0.6, size:34, points:10, damage:1, armorColor:'#3a6b55', bodyColor:'#3a6b55', eyeColor:'#ff0000' },
        creeper: { name:'Крипер', color:'#5d9b3a', hp:1, speed:0.9, size:30, points:20, damage:2, armorColor:'#4a7d2e', bodyColor:'#4a7d2e', eyeColor:'#000', explodes:true },
        skeleton:{ name:'Скелет', color:'#c4c4c4', hp:1, speed:0.5, size:32, points:15, damage:1, armorColor:'#a0a0a0', bodyColor:'#d4d4d4', eyeColor:'#f00', shoots:true },
        spider:  { name:'Паук', color:'#3d2b1f', hp:2, speed:1.1, size:28, points:15, damage:1, armorColor:'#2a1f16', bodyColor:'#2a1f16', eyeColor:'#ff0000' },
        enderman:{ name:'Эндермен', color:'#1a1a1a', hp:4, speed:0.7, size:36, points:50, damage:3, armorColor:'#000', bodyColor:'#000', eyeColor:'#e066ff' }
    };

    // Визуальные стили классов
    const CLASS_STYLES = {
        steve:    { body:'#4d7cb8', skin:'#c49a6c', hair:'#3d2b1f', pants:'#3d3d5c' },
        gunsmith: { body:'#5a4a3a', skin:'#c49a6c', hair:'#111', pants:'#3a2a1a' },
        sukuna:   { body:'#3d2b1f', skin:'#f5d6c3', hair:'#111', pants:'#2a1a10' },
        mage:     { body:'#2c3e50', skin:'#f5d6c3', hair:'#fff', pants:'#1e2a36' },
        choso:    { body:'#8b0000', skin:'#f5d6c3', hair:'#000', pants:'#4a0000' },
        mahito:   { body:'#e0d7c6', skin:'#f5ecd7', hair:'#aaccff', pants:'#b8a99a' },
        dragon:   { body:'#333',    skin:'#ff44ff', hair:'#ff00ff', pants:'#222' }
    };

    const CLASSES = {
        steve:    { name:'Стив',   avatar:'🧑', skills:['🏹','🗡️','🍞'],   skillIds:['bow','sword','bread'], baseHealth:10 },
        gunsmith:{ name:'Оружейник', avatar:'🔫', skills:['🔫','💥','💣','🚀','💣'], skillIds:['rifle','shotgun','grenade','rpg','mine'], baseHealth:10 },
        sukuna:  { name:'Сукуна', avatar:'👹', skills:['⚡','🌀','🌌'],   skillIds:['slash','cleave','worldslash'], baseHealth:10 },
        mage:    { name:'Годжо',  avatar:'🧙', skills:['🔴','🔵','🟣'],   skillIds:['red','blue','purple'], baseHealth:10 },
        choso:   { name:'Чосо',   avatar:'🩸', skills:['➹','☔','📌','💥','🧊'], skillIds:['arrow','rain','spike','burst','control'], baseHealth:10 },
        mahito:  { name:'Махито', avatar:'👤', skills:['🌀','👁️','🌑','✨','👻'], skillIds:['distortion','transfigure','domain','teleport','soul'], baseHealth:10 },
        dragon:  { name:'Дракон', avatar:'🐉', skills:['🔥','🌀','🌪️','💎','⚡'], skillIds:['breath','rift','storm','crystals','rage'], baseHealth:10 }
    };

    const ABILITIES = { /* ... тот же самый объект, что и раньше ... */ };

    // Состояние
    let playerClass = null, maxHealth=10, health=10, score=0, wave=1, coins=0, gameOver=false;
    let playerX=W/2, playerY=GROUND_Y, playerVY=0, isOnGround=true;
    let mouseX=W/2, mouseY=H/2, currentSkillIndex=0, skillNames=[];
    let isCharging=false, chargeTimer=0, currentChargeMax=300, chargeType=null, isMouseDown=false;
    let shakeAmount=0, frameCount=0;
    let mobs=[], redSpells=[], blueVortexes=[], arrows=[], particles=[], floatingTexts=[], alliedMobs=[], mines=[], boss=null;
    let godMode=false, healthBonus=0, breadReduction=0;
    let unlockedCharacters = { steve:true, mage:false, sukuna:false, choso:false, mahito:false, gunsmith:false, dragon:false };
    let keyA=false, keyD=false, keyJump=false;
    let cd = { /* ... */ };

    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (без изменений) ==========
    function createMob(type) { /* ... */ }
    function createAlliedMob(source) { /* ... */ }
    function createExplosion(x,y,color,count=25) { /* ... */ }
    function addFloatingText(x,y,text,color='#fff') { /* ... */ }
    function damagePlayer(amount) { /* ... */ }
    function endGame() { /* ... */ }
    function resetGameState() { /* ... */ }
    function restartGame() { /* ... */ }
    function goToMainMenu() { /* ... */ }
    function updateHearts() { /* ... */ }
    function updateCoinsDisplay() { /* ... */ }

    // ========== ГЕЙМПЛЕЙ (без изменений) ==========
    function shootArrow() { /* ... */ }
    function meleeAttack() { /* ... */ }
    function useBread() { /* ... */ }
    function castRedSpell() { /* ... */ }
    function castBlueVortex() { /* ... */ }
    function castPurpleBeam() { /* ... */ }
    // ... все остальные способности ...
    function finishCharge() { /* ... */ }
    function useAbility() { /* ... */ }
    function spawnBoss() { /* ... */ }
    function spawnWave() { /* ... */ }
    // ... update функции ...

    // ========== УЛУЧШЕННАЯ ОТРИСОВКА ==========
    function drawBackground() {
        // Небо с градиентом
        const grad = ctx.createLinearGradient(0, 0, 0, H*0.7);
        grad.addColorStop(0, '#4a90d9');
        grad.addColorStop(0.5, '#87ceeb');
        grad.addColorStop(1, '#b0e0e6');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H*0.7);

        // Солнце
        const sunX = 120 + Math.sin(frameCount*0.005)*10;
        const sunY = 70;
        ctx.fillStyle = '#fffde7';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 35, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 25, 0, Math.PI*2);
        ctx.fill();

        // Облака
        drawCloud(200, 60, 1.2);
        drawCloud(500, 40, 0.8);
        drawCloud(700, 90, 1.0);

        // Деревня на заднем плане
        drawTree(80, H*0.7-20);
        drawTree(180, H*0.7-15);
        drawHouse(300, H*0.7-50);
        drawTree(450, H*0.7-25);
        drawHouse(600, H*0.7-55);
        drawTree(750, H*0.7-18);

        // Земля
        const groundGrad = ctx.createLinearGradient(0, H*0.7, 0, H);
        groundGrad.addColorStop(0, '#7c9c4c');
        groundGrad.addColorStop(0.3, '#6b8e3a');
        groundGrad.addColorStop(0.7, '#5a7a2a');
        groundGrad.addColorStop(1, '#4a6a1a');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, H*0.7, W, H*0.3);
    }

    function drawCloud(x, y, scale) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.ellipse(x, y, 30*scale, 15*scale, 0, 0, Math.PI*2);
        ctx.ellipse(x+25*scale, y-5, 25*scale, 15*scale, 0, 0, Math.PI*2);
        ctx.ellipse(x-20*scale, y-2, 20*scale, 12*scale, 0, 0, Math.PI*2);
        ctx.fill();
    }

    function drawTree(x, y) {
        // Ствол
        ctx.fillStyle = '#8B5A2B';
        ctx.fillRect(x-4, y-20, 8, 40);
        // Крона
        ctx.fillStyle = '#228B22';
        ctx.beginPath();
        ctx.moveTo(x, y-40);
        ctx.lineTo(x+20, y-10);
        ctx.lineTo(x-20, y-10);
        ctx.fill();
        ctx.fillStyle = '#2E8B57';
        ctx.beginPath();
        ctx.moveTo(x, y-50);
        ctx.lineTo(x+15, y-20);
        ctx.lineTo(x-15, y-20);
        ctx.fill();
    }

    function drawHouse(x, y) {
        // Стены
        ctx.fillStyle = '#D2B48C';
        ctx.fillRect(x-20, y-25, 40, 40);
        // Крыша
        ctx.fillStyle = '#A0522D';
        ctx.beginPath();
        ctx.moveTo(x-25, y-25);
        ctx.lineTo(x, y-50);
        ctx.lineTo(x+25, y-25);
        ctx.fill();
        // Окно
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(x-6, y-15, 12, 12);
    }

    function drawMob(m) {
        ctx.save();
        const x = Math.floor(m.x), y = Math.floor(m.y);
        const s = m.size;
        const wobX = Math.sin(frameCount*0.15+m.wobble)*3;
        const wobY = Math.cos(frameCount*0.12+m.wobble)*2;

        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(x, y+s/2, s/2, 4, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.translate(wobX, wobY);

        // Тело в зависимости от типа
        if (m.type === 'zombie') {
            // Ноги
            const legSwing = Math.sin(frameCount*0.2 + m.walkPhase)*5;
            ctx.fillStyle = '#3a6b55';
            ctx.fillRect(x-s/4, y+s/4, s/5, s/5 + legSwing);
            ctx.fillRect(x+s/12, y+s/4, s/5, s/5 - legSwing);
            // Тело
            ctx.fillStyle = '#4a8c6f';
            ctx.fillRect(x-s/2, y-s/2, s, s);
            // Рубашка
            ctx.fillStyle = '#5a7c5f';
            ctx.fillRect(x-s/2+2, y-s/4, s-4, s/2);
            // Голова
            ctx.fillStyle = '#8c7a6c';
            ctx.fillRect(x-s/3, y-s/2-8, s/1.5, 10);
            // Глаза
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(x-6, y-s/3-2, 3, 3);
            ctx.fillRect(x+3, y-s/3-2, 3, 3);
        } else if (m.type === 'skeleton') {
            ctx.fillStyle = '#d4d4d4';
            ctx.fillRect(x-s/2, y-s/2, s, s);
            ctx.fillStyle = '#000';
            ctx.fillRect(x-4, y-4, 3, 3);
            ctx.fillRect(x+3, y-4, 3, 3);
            ctx.fillStyle = '#f00';
            ctx.fillRect(x-3, y-3, 2, 2);
            ctx.fillRect(x+4, y-3, 2, 2);
        } else if (m.type === 'creeper') {
            ctx.fillStyle = '#5d9b3a';
            ctx.fillRect(x-s/2, y-s/2, s, s);
            ctx.fillStyle = '#000';
            ctx.fillRect(x-5, y-5, 3, 3);
            ctx.fillRect(x+4, y-5, 3, 3);
            ctx.fillRect(x-2, y+2, 3, 3);
            ctx.fillRect(x+4, y+2, 3, 3);
        } else if (m.type === 'spider') {
            ctx.fillStyle = '#2a1f16';
            ctx.fillRect(x-s/2, y-s/2, s, s*0.8);
            for(let l=0; l<4; l++) {
                const side = l<2 ? -1 : 1;
                const kick = Math.sin(frameCount*0.3 + m.walkPhase + l)*6;
                ctx.fillStyle = '#1a0f0a';
                ctx.fillRect(x+side*8, y+s/4+l*3, 3, 8+kick);
            }
            ctx.fillStyle = '#f00';
            ctx.fillRect(x-5, y-8, 3, 3);
            ctx.fillRect(x+4, y-8, 3, 3);
        } else if (m.type === 'enderman') {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x-s/2, y-s/2, s, s*1.3);
            ctx.fillStyle = '#e066ff';
            ctx.fillRect(x-4, y-6, 3, 3);
            ctx.fillRect(x+4, y-6, 3, 3);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x-3, y-5, 1, 1);
            ctx.fillRect(x+5, y-5, 1, 1);
        }

        // Полоска здоровья
        if (m.hp < m.maxHp) {
            const bw = s, bh = 4, by = y - s/2 - 10;
            ctx.fillStyle = '#333';
            ctx.fillRect(x-bw/2, by, bw, bh);
            ctx.fillStyle = m.hp > 0 ? '#5f5' : '#f55';
            ctx.fillRect(x-bw/2, by, bw*(m.hp/m.maxHp), bh);
        }
        ctx.restore();
    }

    function drawPlayer() {
        if (!playerClass) return;
        const style = CLASS_STYLES[playerClass];
        const px = playerX, py = playerY;
        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.ellipse(px, py+15, 12, 4, 0, 0, Math.PI*2);
        ctx.fill();

        // Ноги
        ctx.fillStyle = style.pants;
        ctx.fillRect(px-7, py-2, 5, 14);
        ctx.fillRect(px+2, py-2, 5, 14);
        // Тело
        ctx.fillStyle = style.body;
        ctx.fillRect(px-9, py-18, 18, 20);
        // Голова
        ctx.fillStyle = style.skin;
        ctx.fillRect(px-7, py-28, 14, 14);
        // Волосы
        ctx.fillStyle = style.hair;
        ctx.fillRect(px-8, py-30, 16, 5);
        // Глаза
        ctx.fillStyle = '#fff';
        ctx.fillRect(px-4, py-24, 3, 3);
        ctx.fillRect(px+3, py-24, 3, 3);
        ctx.fillStyle = '#000';
        ctx.fillRect(px-3, py-23, 2, 2);
        ctx.fillRect(px+4, py-23, 2, 2);

        // Оружие/магия в руке
        const skillId = CLASSES[playerClass].skillIds[currentSkillIndex];
        if (skillId === 'bow') {
            ctx.fillStyle = '#8b6914';
            ctx.fillRect(px+8, py-20, 2, 20);
        } else if (skillId === 'sword') {
            ctx.fillStyle = '#ccc';
            ctx.fillRect(px+9, py-22, 2, 18);
        } else if (playerClass === 'mage') {
            ctx.fillStyle = '#b44dff';
            ctx.beginPath();
            ctx.arc(px+12, py-15, 5, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function draw() {
        ctx.clearRect(0,0,W,H);
        let sx=0,sy=0;
        if(shakeAmount>0.5){ sx=(Math.random()-0.5)*shakeAmount*2; sy=(Math.random()-0.5)*shakeAmount*2; }
        ctx.save();
        ctx.translate(sx,sy);
        drawBackground();
        // Эффекты способностей
        blueVortexes.forEach(v => {
            ctx.strokeStyle = 'rgba(70,130,255,0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(v.x, v.y, v.radius, 0, Math.PI*2);
            ctx.stroke();
        });
        // Снаряды
        const proj = playerClass==='steve'?arrows:redSpells;
        proj.forEach(p => {
            ctx.fillStyle = p.color || '#ff3333';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size || 4, 0, Math.PI*2);
            ctx.fill();
        });
        mobs.forEach(m => drawMob(m));
        if (boss) {
            // Отрисовка босса с деталями
            if (boss.type === 'cube') {
                ctx.fillStyle = '#ff8800';
                ctx.fillRect(boss.x-25, boss.y-25, 50, 50);
                ctx.fillStyle = '#333';
                ctx.fillRect(boss.x-30, boss.y-35, 60, 6);
                ctx.fillStyle = '#f55';
                ctx.fillRect(boss.x-30, boss.y-35, 60*(boss.hp/boss.maxHp), 6);
            }
        }
        drawPlayer();
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x-1, p.y-1, p.size||2, p.size||2);
        });
        ctx.restore();
    }

    // ... (остальные функции update, UI, мобильное управление без изменений) ...

    function gameLoop() { if(playerClass) { update(); draw(); } requestAnimationFrame(gameLoop); }

    // Инициализация
    setupMobileButtons();
    updateCoinsDisplay();
    gameLoop();
})();
</script>
</body>
</html>
